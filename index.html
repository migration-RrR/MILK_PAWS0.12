  ctx.lineTo(x+w, y+h-r);

  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);

  ctx.closePath();
}

window.addEventListener('keydown', function(e){
  if(e.code === 'Space' && !e.repeat){
    e.preventDefault(); au();
    var g = game.glass;
    if(game.view === 0 && g.placed){
      if(g.orderType === 'foam' && g.used) startWhip();
      else startPour();
    }
  }
});
window.addEventListener('keyup', function(e){ if(e.code === 'Space'){ e.preventDefault(); stopPour(); stopWhip(); } });

// Свайпы между комнатами: Склад (-1) <-> Бар (0) <-> Кухня (1)
var touchX = 0, touchY = 0, swipeBlock = false;

function canSwitchView(){
  return game.phase === 'play' && !game.drag.active && !game.glass.pouring && !game.glass.whipping && !game.dlg &&
    passEl.style.display !== 'block' && bookEl.classList.contains('hid') && optsEl.classList.contains('hid');
}
function goView(nextV){
  if(nextV < -1 || nextV > 1 || nextV === game.view || !canSwitchView()) return false;
  au(); sStep();
  game.view = nextV; fadeT = .2;
  refresh();
  return true;
}
$('navL').addEventListener('click', function(){ goView(game.view - 1); });
$('navR').addEventListener('click', function(){ goView(game.view + 1); });

window.addEventListener('touchstart', function(e){
  swipeBlock = false;
  touchX = e.touches[0].clientX;
  touchY = e.touches[0].clientY;
}, {passive: true});

window.addEventListener('touchend', function(e){
  // pointerup срабатывает раньше touchend: если жест был перетаскиванием предмета
  // (стакан в раковину, банка в бочонок), это НЕ свайп между комнатами.
  var blocked = swipeBlock; swipeBlock = false;
  if(blocked) return;
  var dx = e.changedTouches[0].clientX - touchX;
  var dy = Math.abs(e.changedTouches[0].clientY - touchY);
  if(Math.abs(dx) > 65 && dy < 75){
    goView(game.view + (dx < 0 ? 1 : -1));
  }
}, {passive: true});

function makeDocData(c){
  var r = Math.random();
  if(r < .65){ return {valid: true, name: c.d.fn, by: c.d.by, exp: 2028, photoCat: c, reason: ''}; }
  else if(r < .82){ return {valid: false, name: c.d.fn, by: 2011, exp: 2028, photoCat: c, reason: 'Кот ещё котёнок (нет 18 лет)!'}; }
  else if(r < .92){ return {valid: false, name: c.d.fn, by: c.d.by, exp: 2023, photoCat: c, reason: 'Паспорт просрочен!'}; }
  else{
    var other = CATS.filter(function(x){ return x.id !== c.d.id; })[0] || CATS[0];
    return {valid: false, name: c.d.fn, by: c.d.by, exp: 2028, photoCat: {d: other, ph: 0, stache: 0, purr: 0, sip: false}, reason: 'Чужая фотография в паспорте!'};
  }
}

  '<div class="pbtns"><button class="bt ok" id="pok">ОДОБРИТЬ</button><button class="bt no" id="pno">ОТКАЗАТЬ</button></div>';

      addFloat(c.x, 235, 'Верный отказ! +10 ◈', '#78c878');
      tone(880, .1, 'triangle'); topBar(); save();
      c.bub = 'Эх, раскусили... Ладно, пойду.'; c.bt = 2.2;
      setTimeout(function(){ leave(c, false); }, 900);
    }else{
      game.money = Math.max(0, game.money - 6); game.combo = 0; game.st.err++;
      addFloat(c.x, 235, 'Зря отказали (-6 ◈)', '#e06060');
      tone(200, .15, 'sawtooth'); topBar(); save();
      c.bub = 'Но у меня всё в порядке с документами!'; c.bt = 2.2;
      setTimeout(function(){ leave(c, false); }, 900);

function resetGlass(){
  var g = game.glass;
  g.placed = false; g.x = GX; g.y = GY; g.sc = 1; g.level = 0; g.pouring = false; g.inertia = 0; g.used = false;
  g.serving = false; g.settle = 0; g.sp = 0; g.orderType = 'normal'; g.foam = 0; g.whipping = false;
  g.needsDoc = false; g.docVerified = false; g.docData = null; g.needsSnack = null; g.snackGiven = false; g.riskMode = false; g.pressure = 0;
}

function showEvent(txt){
  var el = $('evt'); if(!el) return;
  el.textContent = txt; el.style.display = 'block'; evtT = 5;
}

function triggerRandomEvent(){
  showEvent('За окном тихо падает пушистый снег. В баре тепло и уютно.');
  game.priceMult = 1;
}

function startShift(){
  var st = game.st;
  st.serve = 0; st.happy = 0; st.perf = 0; st.tips = 0; st.acc = 0; st.err = 0; st.m0 = game.money;
  game.cats = []; game.active = null; game.dlg = null; dlgEl.style.display = 'none'; passEl.style.display = 'none';
  game.served = 0; game.spawned = 0; game.nextT = .5; game.spawnT = 1.0;  game.priceMult = 1;
  game.view = 0; game.drag.active = false; game.drag.type = null; game.wash.active = false; game.wash.t = 0; game.kitchenStep = 0;
  resetGlass(); game.phase = 'play'; sumEl.classList.add('hid'); shopEl.classList.add('hid'); bookEl.classList.add('hid'); optsEl.classList.add('hid');
  triggerRandomEvent(); topBar(); refresh();
}

function spawn(){
  var used = game.cats.filter(function(c){ return c.state !== 'leaving'; }).map(function(c){ return c.slot; });
  var free = [0, 1, 2].filter(function(i){ return used.indexOf(i) === -1; });
  if(free.length === 0) return false;
  var slot = free[Math.floor(Math.random() * free.length)];
  var inBar = game.cats.map(function(c){ return c.d.id; });
  var pool = CATS.filter(function(c){ return inBar.indexOf(c.id) === -1 && c.id !== game.last; });
  var d = pool[Math.floor(Math.random() * pool.length)]; game.last = d.id;
  var left = Math.random() < .5;
  rel(d.id).visits++;
  game.cats.push({
    d: d, slot: slot, x: left ? -80 : W + 80, tx: SLOTS[slot], state: 'entering',
    bub: '', bt: 0, cup: 0, cup0: 0, cupFoam: 0, cyc: 0, lift: 0, tilt: 0,
    sip: false, sit: 0, stache: 0, purr: 0, pat: 1, res: 0, talk: false,
    ph: Math.random()*6, isSpecial: false, gotSnack: false
  });
  game.spawned++; sStep(); return true;
}

function activate(c){
  var g = game.glass; game.active = c; c.state = 'active'; resetGlass();
  var oType = 'normal';
  var r = Math.random();
  if((game.day > 1 || game.shift >= 1) && r < .26) oType = 'aged';
  else if(game.upg.foam > 0 && r > .68) oType = 'foam';

  g.orderType = oType;
  g.target = oType === 'foam' ? (.48 + Math.random()*.22) : (.52 + Math.random()*.32);

  var intro = c.d.i;
  if(oType === 'aged'){
    g.needsDoc = true; g.docData = makeDocData(c);
    intro = 'Мне бы выдержанного сливкового (18+). Вот паспорт!';
  }else if(oType === 'foam'){
    intro += ' И с пышной пенкой!';
  }

  if(game.upg.snacks > 0 && Math.random() < .45){
    g.needsSnack = Math.random() < .5 ? 'fish' : 'cookie';
    intro += g.needsSnack === 'fish' ? ' И рыбный снек!' : ' И печеньку!';
  }

  c.bub = intro; c.bt = 4.2; refresh();
}

function canPour(){
  var g = game.glass;
  return game.phase === 'play' && game.milk > 0.005 && game.active && game.active.state === 'active' && (!g.needsDoc || g.docVerified) && g.placed && !g.used && g.inertia <= 0 && !g.serving && !game.dlg && passEl.style.display !== 'block';
}
function startPour(){
  if(!canPour() || game.glass.pouring) return;
  game.glass.pouring = true; pourOn(140); game.active.bt = 0; game.active.bub = ''; refresh();
}
function stopPour(){
  var g = game.glass; if(!g.pouring) return;
  g.pouring = false;
  g.inertia = Math.max(0.18, 0.42 - game.upg.nozzle*0.08);
  pourOff(); refresh();
}
function startWhip(){
  var g = game.glass;
  if(g.orderType !== 'foam' || !g.placed || !g.used || g.serving || g.whipping) return;
  g.whipping = true; pourOn(260); refresh();
}
function stopWhip(){
  var g = game.glass; if(!g.whipping) return;
  g.whipping = false; g.settle = .35; pourOff(); refresh();
}

function serve(){
  var g = game.glass, c = game.active; if(!c || g.serving) return;
  g.level = Math.max(g.level, .02); g.serving = true; g.sp = 0; c.state = 'reacting';
  var riskScale = g.riskMode ? 0.52 : 1;
  var tolBonus = game.upg.nozzle * .014 * riskScale;
  var totalLv = g.level + (g.orderType === 'foam' ? g.foam*.5 : 0);
  var diff = Math.abs(totalLv - g.target);
  var bullseye = diff < ((g.riskMode ? .012 : .018) + tolBonus*.35);
  var r;
  if(diff < .055 * riskScale + tolBonus) r = 0;
  else if(diff < .105 * riskScale + tolBonus) r = 1;
  else if(diff < .18 + tolBonus) r = 2;
  else r = totalLv < g.target ? 3 : 4;
  if(g.orderType === 'foam' && g.foam < .06 && r < 2) r = 2;

  c.res = r; c.isSpecial = (g.orderType === 'aged'); c.gotSnack = g.snackGiven;
  var st = game.st;
  var basePay = PAY(c.d.b + game.upg.barrel*6)[r];
  if(g.orderType === 'aged' && r < 2) basePay += 8;
  if(g.orderType === 'foam' && r < 2) basePay += 8;
  if(g.needsSnack){
    if(g.snackGiven) basePay += 8;
    else if(r < 2) r = 2;
  }
  basePay = Math.round(basePay * game.priceMult);

  if(g.riskMode){
    if(r === 0) basePay = basePay * 2;
    else basePay = Math.min(-8, basePay - 6);
  }
  if(bullseye && r === 0){
    basePay += 10;
  }

  if(r === 0){
    game.combo++; game.bestCombo = Math.max(game.bestCombo, game.combo);
    if(game.combo > 1) basePay += Math.min(12, game.combo * 2);
  }else if(r > 1){
    game.combo = 0;
  }

  game.money = Math.max(0, game.money + basePay);
  st.serve++; game.total++; game.served++; st.acc += Math.max(0, 1 - diff*4);
  if(r < 2) st.happy++; if(r === 0) st.perf++; if(r > 2) st.err++;

  var rl = rel(c.d.id);
  var decorBonus = game.upg.decor > 0 ? 1 : 0;
  if(r === 0){
    rl.aff += 1 + decorBonus + (bullseye ? 1 : 0);
    addBurst(c.x, 260, bullseye ? '#fff070' : '#ffd890', bullseye ? 24 : 14);
  }
  else if(r === 1 && decorBonus){ rl.aff += 1; }

  var tip = 0;
  if(rl.aff >= 4 && r < 2){ tip += 2 + game.upg.jukebox + (bullseye ? 3 : 0); }
  if(tip > 0){ game.money += tip; st.tips += tip; }

  var tag = bullseye ? '★ СВЕРХ-ИДЕАЛ! ' : (r === 0 ? 'ИДЕАЛЬНО! ' : '');
  if(g.riskMode && r === 0) tag = '⚡ КУШ x2! ' + tag;
  var label = tag + (basePay >= 0 ? '+' : '') + basePay + ' ◈' + (tip ? ' (+' + tip + ' чаевые)' : '');
  addFloat(c.x, 235, label, bullseye ? '#fff060' : (r === 0 ? '#ffd890' : (r > 2 ? '#e06060' : '#c8b898')));

  sRes(r); topBar(); save();
}

function afterServe(){
  var g = game.glass, c = game.active; if(!c) return;
  c.cup = c.cup0 = g.level; c.cupFoam = g.foam; c.state = 'drinking'; c.cyc = 0; c.lift = 0; c.tilt = 0; c.bub = c.d.r[c.res]; c.bt = 3;
  game.shift = Math.min(3, game.served);
  resetGlass(); game.active = null; game.nextT = .8; refresh();
}

function leave(c, angry){
  if(angry){ game.combo = 0; addFloat(c.x, 230, 'Ушёл не дождавшись...', '#e06060'); topBar(); }
  c.state = 'leaving'; c.out = c.x < W/2 ? -1 : 1; c.bub = angry ? 'Слишком долго...' : ''; c.bt = angry ? 1.5 : 0;
  if(game.active === c){ game.active = null; resetGlass(); }
  refresh();
}

function openDlg(c){
  if(game.dlg || game.glass.pouring || game.glass.whipping || passEl.style.display === 'block' || c.state === 'leaving' || c.state === 'entering' || c.state === 'reacting') return;
  var u = unseen(c);
  if(u.length === 0){
    var msg = CHATTER[Math.floor(Math.random() * CHATTER.length)];
    c.bub = msg; c.bt = 2.5;
    if(rel(c.d.id).aff >= 3){ c.purr = 1.5; sPurr(); addBurst(c.x, 250, '#e07080', 6); }
    return;
  }
  var idx = u[0], q = c.d.q[idx]; game.dlg = {c: c, idx: idx, stage: 0, t: 0}; c.talk = true;
  var hearts = ''; for(var i=0; i<Math.min(5, Math.max(0, rel(c.d.id).aff)); i++) hearts += '♥';
  var btnsHtml = '';
  for(var i=0; i<q[1].length; i++){
    btnsHtml += '<button class="bt" data-i="' + i + '">' + q[1][i][0] + '</button>';
  }
  dlgEl.innerHTML = '<div class="nm"><span>' + c.d.n.toUpperCase() + '</span><span class="hearts">' + hearts + '</span></div><div class="tx">' + q[0] + '</div>' + btnsHtml;
  dlgEl.style.display = 'block'; refresh();
}

dlgEl.addEventListener('click', function(e){
  var d = game.dlg; if(!d) return; au(); sClick();
  if(d.stage === 1){ closeDlg(); return; }
  var b = e.target.closest('button'); if(!b) return;
  var ch = d.c.d.q[d.idx][1][parseInt(b.dataset.i, 10)], rl = rel(d.c.d.id);
  var delta = ch[1] + (ch[1] > 0 && game.upg.decor > 1 ? 1 : 0);
  rl.aff = Math.max(0, rl.aff + delta); rl.seen.push(d.idx);
  if(delta > 0){ addBurst(d.c.x, 250, '#e07080', 8); addFloat(d.c.x, 225, '+' + delta + ' ♥', '#e08090'); }
  d.stage = 1; d.t = 0;
  dlgEl.innerHTML = '<div class="nm">' + d.c.d.n.toUpperCase() + '</div><div class="tx">' + ch[2] + '</div><button class="bt">ОК</button>'; save();
});

function closeDlg(){
  var d = game.dlg; if(!d) return;
  d.c.talk = false; game.dlg = null; dlgEl.style.display = 'none'; refresh();
}

function endShift(){
  game.phase = 'summary'; refresh();
  var s = game.st, e = game.money - s.m0, acc = s.serve ? Math.round(s.acc / s.serve * 100) : 0;
  sumEl.classList.remove('hid');
  var rows = [
    ['Смена', dayLabel() + ' · ' + SN[game.shift]],
    ['Обслужено', s.serve + '/' + NSHIFT],
    ['Выручка за смену', (e >= 0 ? '+' : '') + e + ' ◈'],
    ['Средняя точность', acc + '%'],
    ['Довольных клиентов', s.happy + '/' + s.serve],
    ['Ошибок', s.err],
    ['Чаевые от друзей', '+' + s.tips + ' ◈']
  ];
  var rowsHtml = '';
  for(var i=0; i<rows.length; i++){
    rowsHtml += '<div class="row"><span>' + rows[i][0] + '</span><b>' + rows[i][1] + '</b></div>';
  }
  sumEl.innerHTML = '<div class="box"><div class="st">КОНЕЦ СМЕНЫ</div>' + rowsHtml +
  '<button class="bt" id="goshop" style="margin:1em auto .5em;display:block">МАГАЗИН БАРА (' + game.money + ' ◈)</button>' +
  '<button class="bt p" id="nx" style="margin:0 auto;display:block">СЛЕДУЮЩАЯ СМЕНА</button></div>';
  $('goshop').onclick = function(){ au(); sClick(); openShop(); };
  $('nx').onclick = function(){ au(); sClick(); nextShift(); };
  save();
}

function nextShift(){
  game.shift++; if(game.shift > 3){ game.shift = 0; game.day++; }
  save(); startShift();
}

var shopFlash = '';
function openShop(){
  sumEl.classList.add('hid'); shopEl.classList.remove('hid');
  var html = '<div class="box shbox"><div class="awn"></div><div class="shhd"><div class="st">ЛАВКА БАРА</div><div class="shmon">◈ ' + game.money + '</div></div><div class="shgrid">';
  for(var i=0; i<UPGRADES.length; i++){
    var u = UPGRADES[i], lv = game.upg[u.id] || 0, isMax = lv >= u.max, price = isMax ? 0 : u.cost[lv], pips = '';
    for(var j=0; j<u.max; j++) pips += '<i class="' + (j < lv ? 'on' : '') + '"></i>';
    html += '<div class="scard' + (lv > 0 ? ' own' : '') + (isMax ? ' max' : '') + (shopFlash === u.id ? ' flash' : '') + '">' +
      (isMax ? '<div class="badge">МАКС</div>' : (lv > 0 ? '<div class="badge">✔ КУПЛЕНО</div>' : '')) +
      '<canvas class="sico" width="32" height="32" data-ic="' + u.id + '" data-lv="' + lv + '"></canvas>' +
      '<div class="sn">' + u.n + '</div><div class="pips">' + pips + '</div><div class="sd">' + u.d + '</div>' +
      (isMax ? '<button class="sbtn" disabled>УЛУЧШЕНО</button>' :
        '<button class="sbtn" data-id="' + u.id + '" ' + (game.money < price ? 'disabled' : '') + '>' + (lv > 0 ? 'УЛУЧШИТЬ · ' : 'КУПИТЬ · ') + price + ' ◈</button>' +
        (game.money < price ? '<div class="need">не хватает ' + (price - game.money) + ' ◈</div>' : '')) + '</div>';
  }
  html += '</div><div style="padding:0 .8em .8em"><button class="bt p" id="shdone" style="width:100%;margin:0;display:block">К СМЕНЕ</button></div></div>';
  shopEl.innerHTML = html; shopFlash = '';
  var cvs = shopEl.querySelectorAll('canvas.sico');
  for(var i=0; i<cvs.length; i++) drawIcon(cvs[i], cvs[i].getAttribute('data-ic'), parseInt(cvs[i].getAttribute('data-lv'), 10) || 0);
  var sbtns = shopEl.querySelectorAll('.sbtn');
  for(var i=0; i<sbtns.length; i++){
    (function(btn){
      var uid = btn.getAttribute('data-id'); if(!uid) return;
      btn.onclick = function(){
        var u = UPGRADES.filter(function(x){ return x.id === uid; })[0];
        var lv = game.upg[u.id] || 0, price = u.cost[lv];
        if(lv < u.max && game.money >= price){
          au(); tone(960, .12, 'triangle'); setTimeout(function(){ tone(1280, .12, 'triangle'); }, 90);
          game.money -= price; game.upg[u.id] = lv + 1; shopFlash = uid;
          save(); topBar(); openShop();
        }
      };
    })(sbtns[i]);
  }
  $('shdone').onclick = function(){ au(); sClick(); nextShift(); };
}

  optsEl.innerHTML = '<div class="box"><div class="st">НАСТРОЙКИ ЗВУКА</div>' +
  '<div class="srow">Громкость музыки: <b id="vbgm">' + Math.round(game.snd.bgm*100) + '%</b><input type="range" id="rbgm" min="0" max="100" value="' + Math.round(game.snd.bgm*100) + '"></div>' +
  '<div class="srow">Громкость звуков: <b id="vsfx">' + Math.round(game.snd.sfx*100) + '%</b><input type="range" id="rsfx" min="0" max="100" value="' + Math.round(game.snd.sfx*100) + '"></div>' +
  '<button class="bt" id="bmute" style="margin:.8em auto;display:block">' + (game.snd.muted ? 'ВКЛЮЧИТЬ ЗВУК' : 'ВЫКЛЮЧИТЬ ЗВУК') + '</button>' +
  '<button class="bt p" id="optcl" style="margin:0 auto;display:block">ГОТОВО</button></div>';
  $('rbgm').oninput = function(e){ game.snd.bgm = e.target.value / 100; $('vbgm').textContent = e.target.value + '%'; save(); };
  $('rsfx').oninput = function(e){ game.snd.sfx = e.target.value / 100; $('vsfx').textContent = e.target.value + '%'; save(); };
  $('bmute').onclick = function(){ game.snd.muted = !game.snd.muted; if(game.snd.muted) pourOff(); save(); openOpts(); };
  $('optcl').onclick = function(){ au(); sClick(); optsEl.classList.add('hid'); refresh(); };
}

function showTitle(){
  game.phase = 'title'; titleEl.classList.remove('hid');
  titleEl.innerHTML = '<div class="logo">MILK &amp;<br>PAWS</div><div class="sub">УЮТНЫЙ БАР В МИРЕ КОТОВ</div>' + (hasSave() ? '<button class="bt p" id="co">ПРОДОЛЖИТЬ</button>' : '') + '<button class="bt" id="nw">НОВАЯ ИГРА</button>';
  $('nw').onclick = function(){
    au(); sClick(); try{ localStorage.removeItem(KEY); }catch(e){}
    game.day = 1; game.shift = 0; game.money = 50; game.total = 0; game.rel = {}; game.combo = 0; game.bestCombo = 0;
    game.cleanGlasses = 3; game.dirtyGlasses = 0; game.milk = 1.0; game.milkBought = 0; game.warehouseCan = false; game.pouringCan = 0;
    game.upg = {nozzle:0, barrel:0, jukebox:0, snacks:0, foam:0, decor:0, sink:0};
    titleEl.classList.add('hid'); startShift();
  };
  var co = $('co');
  if(co) co.onclick = function(){
    au(); sClick();
    if(!load()){ game.day = 1; game.shift = 0; game.money = 50; }
    titleEl.classList.add('hid'); startShift();
  };
}

var dragStartX = 0, dragStartY = 0;

cv.addEventListener('pointerdown', function(e){
  au();
  if(game.phase !== 'play' || game.dlg || passEl.style.display === 'block' || game.glass.pouring || game.glass.whipping || !bookEl.classList.contains('hid') || !optsEl.classList.contains('hid')) return;
  var r = cv.getBoundingClientRect(), px = (e.clientX - r.left)*W/r.width, py = (e.clientY - r.top)*H/r.height;
  dragStartX = px; dragStartY = py;
  if(py > 170 && py < 255 && ((px < 26 && game.view > -1) || (px > W - 26 && game.view < 1))){
    goView(px < 26 ? game.view - 1 : game.view + 1); e.preventDefault(); return;
  }

  if(game.view === 0){
    if(px > 10 && px < 226 && py > 478 && py < 612){
      var gq = game.glass;
      if(game.active && game.active.state === 'active' && (!gq.needsDoc || gq.docVerified) && !gq.placed && game.cleanGlasses > 0){
        game.drag.active = true; game.drag.type = 'clean_glass'; game.drag.x = px; game.drag.y = py;
      }else if(game.cleanGlasses <= 0){
        tone(180, .15, 'sawtooth'); addFloat(110, 470, 'Нет чистых — на кухню!', '#e0a060');
      }
      return;
    }
    if(px >= 230 && py > 478 && py < 612){ addFloat(px, 470, 'Грязные — на кухню ▶', '#e0a060'); return; }

    for(var i=0; i<game.cats.length; i++){
      var c = game.cats[i];
      if(c.state === 'leaving' || c.state === 'entering') continue;
      var hw = 45 * .76 * c.d.s * (c.d.w || 1) + 14;
      if(Math.abs(px - c.x) < hw && py > 175 && py < 345){
        if(c.state === 'waiting' && (!game.active || (!game.glass.placed && game.glass.level === 0 && game.glass.inertia <= 0 && !game.glass.serving))){
          if(game.active && game.active !== c){ game.active.state = 'waiting'; game.active.bub = ''; }
          activate(c); sClick();
        }else if(c.state === 'drinking' || c.state === 'sitting'){
          c.purr = 1.4; sPurr(); addBurst(c.x, 245, '#e07080', 6);
          if(!c.petted){ c.petted = true; rel(c.d.id).aff++; addFloat(c.x, 225, 'Мррр +1 ♥', '#e08090'); save(); }
        }else{
          openDlg(c);
        }
        e.preventDefault(); return;
      }
    }
  }else if(game.view === 1){
    if(game.dirtyGlasses - (game.wash.active ? 1 : 0) > 0 && px > 14 && px < 112 && py > 360 && py < 450){
      game.drag.active = true;
      game.drag.type = 'dirty_glass';
      game.drag.x = px; game.drag.y = py;
    }
  }else if(game.view === -1){
    if(px > 50 && px < W - 50 && py > 500 && py < 596){
      var price = milkPrice();
      if(!game.warehouseCan && game.pouringCan <= 0 && game.money >= price){
        game.money -= price;
        game.milkBought++;
        game.warehouseCan = true;
        tone(620, .09, 'triangle');
        addFloat(W/2, 490, '-' + price + ' ◈', '#e0a060');
        topBar(); save();
      }else if(game.money < price){
        tone(180, .15, 'sawtooth');
      }
      return;
    }
    if(game.warehouseCan && game.pouringCan <= 0 && Math.abs(px - 115) < 42 && Math.abs(py - 395) < 48){
      game.drag.active = true;
      game.drag.type = 'milk_can';
      game.drag.x = px; game.drag.y = py;
    }
  }
}, {passive: false});

cv.addEventListener('pointermove', function(e){
  if(!game.drag.active) return;
  var r = cv.getBoundingClientRect(), px = (e.clientX - r.left)*W/r.width, py = (e.clientY - r.top)*H/r.height;
  game.drag.x = px; game.drag.y = py;
  refresh();
});

cv.addEventListener('pointerup', function(e){
  if(!game.drag.active) return;
  var r = cv.getBoundingClientRect(), px = (e.clientX - r.left)*W/r.width, py = (e.clientY - r.top)*H/r.height;
  game.drag.active = false;
  swipeBlock = true;

  if(game.view === 0 && game.drag.type === 'clean_glass'){
    if(py < 480 && py > 330 && Math.abs(px - GX) < 90){
      game.cleanGlasses--;
      var g = game.glass;
      g.placed = true;
      tone(480, .08, 'sine', .05);
    }
  }else if(game.view === 1 && game.drag.type === 'dirty_glass'){
    if(px > 100 && px < 260 && py > 355 && py < 450){
      if(game.wash.active){ addFloat(180, 400, 'Раковина занята', '#e0a060'); tone(180, .12, 'sawtooth'); }
      else if(game.dirtyGlasses > 0){ startWash(); }
    }else{
      addFloat(180, 400, 'Брось в раковину', '#e0a060');
    }
  }else if(game.view === -1 && game.drag.type === 'milk_can'){
    if(Math.abs(px - 275) < 65 && py > 310 && py < 445){
      game.warehouseCan = false;
      game.pouringCan = 1.1;
      pourOn(120);
    }
  }
  game.drag.type = null;
  refresh();
});

cv.addEventListener('pointercancel', function(){
  if(game.drag.active){ game.drag.active = false; game.drag.type = null; swipeBlock = true; refresh(); }
});

function update(dt){
  game.time += dt;
  if(evtT > 0){ evtT -= dt; if(evtT <= 0) $('evt').style.display = 'none'; }
  if(game.blackout > 0) game.blackout -= dt;

  var rainSp = game.heavyRain ? 1.7 : 1;
  for(var i=0; i<game.rain.length; i++){
    var d = game.rain[i];
    d.y += (7 + d.s*11) * rainSp * dt;
    if(d.y > 112){ d.y = 0; d.x = Math.random()*110; }
  }
  for(var i=0; i<game.particles.length; i++){
    var p = game.particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 90 * dt; p.t -= dt;
  }
  game.particles = game.particles.filter(function(p){ return p.t > 0; });
  for(var i=0; i<game.floats.length; i++){
    var f = game.floats[i];
    f.y -= 22 * dt; f.t -= dt;
  }
  game.floats = game.floats.filter(function(f){ return f.t > 0; });

  if(fadeT > 0) fadeT -= dt;
  var skT = Math.min(1, Math.max(0, (game.spawned - 1 + (game.active ? 0.5 : 0)) / NSHIFT));
  if(skyP === null) skyP = skT; else skyP += (skT - skyP) * Math.min(1, dt * 0.4);
  if(game.wash.active){
    game.wash.t += dt;
    if(game.view === 1 && Math.random() < .25) addBurst(150 + Math.random()*60, 400, '#cfeaff', 1);
    if(game.view === 1 && Math.random() < .1) tone(700 + Math.random()*300, .04, 'sine', .02);
    if(game.wash.t >= game.wash.dur) finishWash();
  }
  var g = game.glass;
  var patDrain = (1 / (35 + game.upg.jukebox * 12));

  for(var i=0; i<game.cats.length; i++){
    var c = game.cats[i];
    if(c.purr > 0) c.purr -= dt;
    if(c.state === 'entering'){
      var dir = Math.sign(c.tx - c.x); c.x += dir * 150 * dt;
      if((c.tx - c.x)*dir <= 0){ c.x = c.tx; c.state = 'waiting'; }
    }else if(c.state === 'leaving'){
      c.x += c.out * 115 * dt;
    }else if((c.state === 'waiting' || c.state === 'active') && !c.talk && !g.serving && passEl.style.display !== 'block'){
      c.pat -= patDrain * dt;
      if(c.pat <= 0) leave(c, true);
    }else if((c.state === 'drinking' || c.state === 'sitting') && !c.talk){
      if(c.state === 'drinking'){
        c.cyc += dt; var sip = c.cyc > .6 && c.cyc < 1.7;
        if(sip){
          c.cup = Math.max(0, c.cup - c.cup0 / 4.4 * dt);
          c.cupFoam = Math.max(0, (c.cupFoam || 0) - .12 * dt);
          if(!c.sip) c.sip = true;
        }else if(c.sip){
          c.sip = false; c.stache = 1.8; sGulp();
        }
        var tl = c.cyc < 2 ? 1 : 0;
        c.lift += (tl - c.lift) * Math.min(1, dt*6);
        c.tilt += ((sip ? 1 : 0) - c.tilt) * Math.min(1, dt*8);
        if(c.cyc >= 2.8){
          c.cyc = 0;
          if(c.cup <= .005){
            c.cup = 0; c.cupFoam = 0; c.state = 'sitting'; c.sit = 6 + Math.random()*6;
            game.dirtyGlasses++;
          }
        }
      }else{
        c.sip = false;
        c.lift += (0 - c.lift) * Math.min(1, dt*6);
        c.tilt += (0 - c.tilt) * Math.min(1, dt*8);
        c.sit -= dt;
        if(c.sit <= 0) leave(c, false);
      }
    }
    if(c.bt > 0){ c.bt -= dt; if(c.bt <= 0) c.bub = ''; }
    if(c.stache > 0) c.stache -= dt;
  }
  game.cats = game.cats.filter(function(c){ return !(c.state === 'leaving' && (c.x < -90 || c.x > W + 90)); });

  if(game.phase === 'play'){
    game.nextT -= dt;
    if(!game.active && !g.serving && game.nextT <= 0){
      var w = game.cats.filter(function(c){ return c.state === 'waiting'; })[0];
      if(w) activate(w);
    }
    game.spawnT -= dt;
    if(game.spawned < NSHIFT && game.spawnT <= 0){
      game.spawnT = spawn() ? 14.0 + Math.random()*8.0 : 3.0;
    }
    if(game.spawned >= NSHIFT && game.cats.length === 0 && !game.active && !game.dlg && !game.wash.active && !game.drag.active) endShift();
  }

  var baseSpeed = .62 * (1 - game.upg.nozzle * .08) * (g.riskMode ? 1.28 : 1);
  var pourSpeed = baseSpeed * (0.85 + g.level * 0.55);
  if(game.pouringCan > 0){
    game.pouringCan -= dt;
    game.milk = Math.min(1, game.milk + 0.55 * dt);
    if(game.pouringCan <= 0){
      game.pouringCan = 0;
      pourOff();
      tone(880, .1, 'triangle');
      save();
    }
  }

  if(g.pouring){
    var dm = Math.min(game.milk, pourSpeed * dt);
    g.level = Math.min(1, g.level + dm);
    game.milk = Math.max(0, game.milk - dm * 0.24);
    if(pn && ac){ pn.frequency.setValueAtTime(135 + g.level * 190, ac.currentTime); }
    if(Math.random() < .35) addBurst(NX, g.y + 25*g.sc - 50*g.sc*g.level, '#ffffff', 1);
    if(g.level >= 1 || game.milk <= 0.002) stopPour();
  }
  if(g.inertia > 0){
    g.inertia -= dt;
    g.level = Math.min(1, g.level + pourSpeed * .62 * dt);
    if(g.inertia <= 0){ g.inertia = 0; g.used = true; g.settle = g.orderType === 'foam' ? 1.6 : .42; }
  }
  if(g.whipping){ g.foam = Math.min(.25, g.foam + .22 * dt); if(g.foam >= .25) stopWhip(); }
  if(g.used && !g.serving && !g.whipping && g.settle > 0){ g.settle -= dt; if(g.settle <= 0) serve(); }
  if(g.serving){
    g.sp += dt * 1.6; var c = game.active;
    if(g.sp >= 1) afterServe();
    else if(c){
      var e = g.sp * g.sp * (3 - 2 * g.sp);
      g.x = GX + (c.x - GX) * e; g.y = GY + (348 - GY) * e; g.sc = 1 - .35 * e;
    }
  }
  if(game.dlg && game.dlg.stage === 1){ game.dlg.t += dt; if(game.dlg.t > 3.5) closeDlg(); }
  refresh();
}

var last = 0;
function loop(now){
  var dt = Math.min(.05, (now - last) / 1000) || .016;
  last = now; update(dt); render();
  requestAnimationFrame(loop);
}

showTitle(); topBar(); requestAnimationFrame(loop);
})();
</script></body></html>
