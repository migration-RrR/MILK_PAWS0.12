<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MILK & PAWS</title>
<style>
:root{color-scheme:dark}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0705;font-family:'Courier New',monospace;user-select:none;-webkit-user-select:none;touch-action:none}
#w{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#0a0705;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#ui{position:absolute;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}
#top{position:absolute;top:.7em;left:.7em;right:.7em;display:flex;justify-content:space-between;align-items:center;gap:.35em;font-size:1.1em;color:#c8b898;font-weight:bold;pointer-events:none}
.bd{background:rgba(18,12,8,.9);padding:.28em .6em;border:1px solid #4a301c;white-space:nowrap}
.bt{background:#3a2414;color:#e0d0b0;border:2px solid #7a5530;padding:.7em 1.2em;font:bold 1.3em 'Courier New',monospace;letter-spacing:1px;box-shadow:2px 2px 0 #0a0705;touch-action:none;cursor:pointer}
.bt.p{background:#7a4a1e;border-color:#c87838;color:#fff0d0}
.bt.ok{background:#2d4a28;border-color:#6ca05e;color:#e4f4dc}
.bt.no{background:#5a2420;border-color:#c85a48;color:#ffdcd6}
.bt:active,.bt.on{background:#c87838;color:#3a2414;transform:translate(2px,2px);box-shadow:none}
.bt:disabled{opacity:.4;pointer-events:none}
#btns{position:absolute;bottom:2.1em;left:0;right:0;display:flex;justify-content:center;flex-wrap:wrap;gap:.65em;pointer-events:none;padding:0 .7em}
#btns .bt{pointer-events:auto;display:none}
#hold{font-size:1.5em;padding:.8em 1.25em}
#evt{position:absolute;top:9.4em;left:.8em;right:.8em;background:rgba(34,22,14,.94);border:1px solid #c87838;color:#f5e6c8;padding:.45em .7em;font-size:1.05em;text-align:center;display:none;pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.6);z-index:25}
#dlg{position:absolute;left:.8em;right:.8em;bottom:1em;background:rgba(24,18,14,.98);border:2px solid #7a5530;padding:1em;display:none;box-shadow:0 0 0 3px #0a0705;z-index:15}
#dlg .nm{color:#c87838;font-size:1.2em;font-weight:bold;letter-spacing:2px;margin-bottom:.4em;display:flex;justify-content:space-between}
#dlg .tx{color:#f0e8d0;font-size:1.22em;line-height:1.35;margin-bottom:.8em}
#dlg .bt{display:block;width:100%;margin-top:.45em;font-size:1.12em;padding:.55em .8em;text-align:left;letter-spacing:0}
#pass{position:absolute;left:1em;right:1em;bottom:1em;background:#d8cbb4;color:#1e1610;border:3px solid #4a2e18;padding:.8em;display:none;box-shadow:0 6px 24px rgba(0,0,0,.85);z-index:16}
#pass .phd{display:flex;justify-content:space-between;border-bottom:2px solid #4a2e18;padding-bottom:.35em;margin-bottom:.6em;font-weight:bold;font-size:1.05em;color:#4a2e18}
#pass .pbody{display:flex;gap:.8em;align-items:center}
#pass canvas{width:76px;height:76px;border:2px solid #4a2e18;background:#efe6d4;flex-shrink:0}
#pass .pinfo{font-size:1.05em;line-height:1.45}
#pass .pinfo b{color:#3a2010}
#pass .phint{font-size:.82em;line-height:1.3;margin-top:.6em;color:#5a3a20;border-top:1px dashed #7a5530;padding-top:.4em}
#pass .pbtns{display:flex;gap:.6em;margin-top:.7em}
#pass .pbtns .bt{flex:1;padding:.55em;font-size:1.1em;text-align:center}
#sum,#title,#shop,#book,#opts{position:absolute;inset:0;background:rgba(10,7,5,.96);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:1.4em;z-index:20}
#title{z-index:30;background:#0a0705}
.hid{display:none!important}
.logo{color:#e0d0b0;font-size:4.1em;font-weight:bold;letter-spacing:4px;text-align:center;line-height:1.08;text-shadow:3px 3px 0 #7a4a1e;margin-bottom:.25em}
.sub{color:#8a7050;font-size:1.1em;letter-spacing:2.5px;margin-bottom:2.2em;text-align:center}
#title .bt,#sum .bt,#shop .bt,#book .bt,#opts .bt{width:88%;margin-bottom:.75em;text-align:center}
.box{background:#1a1410;border:2px solid #5a3a22;padding:1.1em;width:100%;max-height:88%;overflow-y:auto}
.st{color:#c87838;font-size:1.5em;font-weight:bold;text-align:center;margin-bottom:.65em;letter-spacing:2px}
.row{display:flex;justify-content:space-between;color:#d0c0a0;font-size:1.15em;padding:.32em 0;border-bottom:1px dashed #3a2414}
.sitem{border:1px solid #3a2414;background:#120d0a;padding:.65em;margin-bottom:.6em;display:flex;justify-content:space-between;align-items:center;gap:.55em}
.sinfo{flex:1}
.sname{color:#f0e0c0;font-size:1.12em;font-weight:bold}
.sdesc{color:#9a866a;font-size:.92em;margin-top:.18em;line-height:1.22}
.sbtn{background:#5a3818;color:#fff0d0;border:1px solid #c87838;padding:.45em .65em;font:bold 1.02em 'Courier New',monospace;cursor:pointer;white-space:nowrap}
.sbtn:disabled{opacity:.4;border-color:#5a3a22;cursor:default}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:.45em}
.ccard{border:1px solid #3a2414;background:#120d0a;padding:.5em;font-size:.96em;color:#d0c0a0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.2em;text-align:center}
.hearts{color:#e06060;letter-spacing:1.5px;font-size:1.05em}
.ibtn{pointer-events:auto;background:rgba(18,12,8,.92);border:1px solid #7a5530;color:#e0d0b0;padding:.25em .5em;font:bold 1em 'Courier New',monospace;cursor:pointer}
.srow{margin:.8em 0;color:#e0d0b0;font-size:1.15em}
.srow input{width:100%;margin-top:.35em;accent-color:#c87838}

/* ===== визуальная полировка ===== */
:root{--amber:#c87838;--amber2:#e0a060;--wood:#7a5530;--cream:#f0e8d0}
.bd{background:linear-gradient(#26190f,#160f0a);border:1px solid var(--wood);border-radius:2px;color:#e8d8b8;box-shadow:0 2px 0 #0a0705,inset 0 1px 0 rgba(255,220,170,.10)}
.bd b{color:var(--cream)}
.bt{background:linear-gradient(#4c3019,#33200f);border-bottom-width:4px;border-radius:2px;box-shadow:0 2px 0 #0a0705,inset 0 1px 0 rgba(255,220,170,.14);transition:transform .08s,filter .15s}
.bt.p{background:linear-gradient(#8c5726,#6a3c14)}
.bt.ok{background:linear-gradient(#36623a,#264426)}
.bt.no{background:linear-gradient(#6a2a24,#4c1c18)}
.bt:active,.bt.on{background:linear-gradient(#e09048,#c87838);color:#3a2414;border-bottom-width:2px;transform:translateY(2px);box-shadow:none}
.bt:disabled{opacity:.4;filter:grayscale(.6)}
.bt:focus-visible,.sbtn:focus-visible,.ibtn:focus-visible,.hnav:focus-visible{outline:2px solid var(--amber2);outline-offset:2px}
.sbtn{background:linear-gradient(#6a4220,#4a2c12);border-radius:2px;transition:filter .15s}
.ibtn{background:linear-gradient(#26190f,#160f0b);border-radius:2px;padding:.3em .55em;box-shadow:0 2px 0 #0a0705}
.ibtn:active{transform:translateY(2px);box-shadow:none}
@media (hover:hover){.bt:hover:not(:disabled){filter:brightness(1.18)}.sbtn:hover:not(:disabled){filter:brightness(1.22)}.ibtn:hover{filter:brightness(1.3)}.hnav:hover{filter:brightness(1.3)}.sitem:hover,.ccard:hover{border-color:var(--wood)}}
.box{background:linear-gradient(#211911,#150f0b);border:2px solid #6a4528;box-shadow:inset 0 0 0 2px #0a0705,0 10px 28px rgba(0,0,0,.65)}
.sitem{background:linear-gradient(#17100c,#100a07);transition:border-color .15s}
.ccard{background:linear-gradient(#17100c,#100a07)}
#sum,#title,#shop,#book,#opts{background:radial-gradient(ellipse at 50% 28%,rgba(70,44,22,.55),rgba(10,7,5,.97) 72%)}
#title{background:radial-gradient(ellipse at 50% 28%,rgba(70,44,22,.7),#0a0705 72%)}
.logo{text-shadow:3px 3px 0 #7a4a1e,0 0 22px rgba(224,160,96,.35)}
#dlg{border-radius:2px;background:linear-gradient(#211911,#15100c);animation:rise .18s ease-out}
#pass{animation:rise .18s ease-out}
#evt{border-radius:2px;animation:fadein .3s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#hold:not(:disabled){animation:glow 1.6s ease-in-out infinite}
#hold.on{animation:none}
@keyframes glow{0%,100%{box-shadow:0 2px 0 #0a0705,0 0 0 rgba(224,160,96,0)}50%{box-shadow:0 2px 0 #0a0705,0 0 14px rgba(224,160,96,.55)}}
#ui>#hud{position:absolute;top:3.6em;left:.7em;right:.7em;display:none;flex-direction:column;gap:.35em;pointer-events:none}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:.4em}
.hroom{color:var(--amber2);font-weight:bold;letter-spacing:3px;font-size:1.1em;text-shadow:1px 1px 0 #0a0705;background:rgba(18,12,8,.7);padding:.15em .7em;border:1px solid #4a301c}
.hnav{pointer-events:auto;min-width:6.4em;background:linear-gradient(#4c3019,#33200f);color:#f0e0c0;border:1px solid var(--amber);padding:.3em .55em;font:bold 1em 'Courier New',monospace;cursor:pointer;border-radius:2px;box-shadow:0 2px 0 #0a0705}
.hnav:active{transform:translateY(2px);box-shadow:none}
.hchips{display:flex;justify-content:center;gap:.35em;flex-wrap:wrap;font-size:.95em}
.hchips .bd{padding:.2em .5em}
.hchips .warn{color:#ff9a88;border-color:#a04a3a}
#ui>#hint{position:absolute;left:1em;right:1em;bottom:2.6em;display:none;text-align:center;color:#f5e6c8;font-size:1.15em;line-height:1.3;background:rgba(18,12,8,.88);border:1px solid var(--amber);padding:.5em .7em;pointer-events:none;border-radius:2px;animation:fadein .3s ease-out}
#top .bd{font-size:.95em}
.dayb{display:flex;flex-direction:column;line-height:1.05;padding:.22em .55em;border-color:var(--amber)}
.dayb b{font-size:1.12em;color:var(--amber2);letter-spacing:.5px}
.dayb span{font-size:.8em;color:#b8a888;letter-spacing:1px}
.money b{color:#ffd870;font-size:1.1em}
.coin{color:var(--amber2)}
.pop,.cmb{animation:popm .35s ease-out}
@keyframes popm{0%{transform:scale(1)}40%{transform:scale(1.22);filter:brightness(1.5)}100%{transform:scale(1)}}
.cmb{color:#9be09b;border-color:#4a8a4a}
.mbar{display:inline-block;width:3.4em;height:.6em;background:#0e0805;border:1px solid #4a301c;vertical-align:middle;margin:0 .3em}
.mbar u{display:block;height:100%;background:#f5ecd8;text-decoration:none}
.warn .mbar u{background:#e07060}
.hchips .ord{border-color:var(--amber);color:#ffe8b8}
.hnav{transition:filter .15s,transform .08s}
.shbox{padding:0!important;overflow:hidden;display:flex;flex-direction:column;background:linear-gradient(#2a1c12,#17100b)}
.awn{height:2.1em;flex-shrink:0;background:repeating-linear-gradient(90deg,#b8442f 0 1.6em,#f0e4cc 1.6em 3.2em);border-bottom:3px solid #2a1208;box-shadow:0 .35em 0 -.05em rgba(0,0,0,.3)}
.shhd{display:flex;justify-content:space-between;align-items:center;padding:.6em .8em .3em}
.shhd .st{margin:0;font-size:1.25em}
.shmon{color:#ffd870;font-weight:bold;font-size:1.2em;background:#120b07;border:1px solid var(--wood);padding:.15em .5em}
.shgrid{display:grid;grid-template-columns:1fr 1fr;gap:.8em .55em;padding:.6em .8em .8em;overflow-y:auto;flex:1;min-height:0}
.scard{position:relative;background:linear-gradient(#241911,#150f0b);border:2px solid #4a301c;padding:.5em;display:flex;flex-direction:column;gap:.3em;transition:transform .12s,border-color .15s;box-shadow:0 .45em 0 -.1em #5a3a1c}
.scard.wide{grid-column:1/-1}
.scard.own{border-color:#6ca05e}
.scard.max{border-color:#e0b050;box-shadow:0 .45em 0 -.1em #8a6a2c,0 0 .9em rgba(224,176,80,.25)}
.scard.flash{animation:flashc .5s ease-out}
@keyframes flashc{0%{transform:scale(1)}30%{transform:scale(1.07);filter:brightness(1.6)}100%{transform:scale(1)}}
.sico{width:4.4em;height:4.4em;image-rendering:pixelated;align-self:center;background:radial-gradient(circle,#3a2818,#1a110a);border:1px solid #4a301c}
.sn{color:#f0e0c0;font-weight:bold;font-size:1em;text-align:center}
.pips{display:flex;gap:.25em;justify-content:center}
.pips i{width:1em;height:.5em;background:#120b07;border:1px solid #4a301c}
.pips i.on{background:#78c878;border-color:#9ad89a}
.scard.max .pips i.on{background:#e0b050}
.sd{color:#9a866a;font-size:.8em;line-height:1.22;flex:1}
.badge{position:absolute;top:-.6em;right:-.3em;background:#2d4a28;color:#d4f4cc;border:1px solid #6ca05e;font-size:.75em;font-weight:bold;padding:.1em .4em}
.scard.max .badge{background:#6a4a14;color:#ffe8a0;border-color:#e0b050}
.scard .sbtn{width:100%;text-align:center;padding:.5em .2em;font-size:.9em}
.need{color:#e08070;font-size:.75em;text-align:center}
/* ===== v11: обучение, книга, звёзды ===== */
#tut{position:absolute;top:10.4em;left:.8em;right:.8em;background:rgba(40,26,12,.96);border:2px solid #e0a040;color:#fff0d0;padding:.55em .7em;font-size:1.02em;line-height:1.3;display:none;pointer-events:none;z-index:14;border-radius:2px;box-shadow:0 2px 8px rgba(0,0,0,.6)}
#tut b{color:#ffd870}
#tut .sbtn{pointer-events:auto;width:auto;font-size:.8em;padding:.3em .5em;margin-top:.4em}
.tabs{display:flex;gap:.4em;margin-bottom:.7em}
.tb{flex:1;background:#17100c;color:#9a866a;border:1px solid #4a301c;padding:.45em .2em;font:bold 1em 'Courier New',monospace;cursor:pointer}
.tb.on{background:linear-gradient(#8c5726,#6a3c14);color:#fff0d0;border-color:var(--amber)}
.pcv{width:56px;height:64px;background:radial-gradient(circle at 50% 40%,#3a2818,#150f0b);border:1px solid #4a301c;image-rendering:auto}
.cdet{display:flex;gap:.8em;align-items:flex-start}
.cdet canvas{width:110px;height:120px;flex-shrink:0;border:2px solid #7a5530;background:radial-gradient(circle at 50% 40%,#4a3420,#150f0b)}
.cinfo{color:#d0c0a0;font-size:1em;line-height:1.5}
.cinfo b.cn{color:#ffd870;font-size:1.15em}
.cdesc{color:#e0d0b0;font-size:1.05em;line-height:1.4;margin:.8em 0;padding:.6em;border:1px dashed #5a3a22;background:#120d0a}
.arow{display:flex;gap:.6em;align-items:center;padding:.45em;border:1px solid #3a2414;background:#120d0a;margin-bottom:.4em;color:#6a5a4a}
.arow.got{color:#f0e0c0;border-color:#c87838;background:#1e150d}
.arow .ai{font-size:1.6em;width:1.5em;text-align:center;filter:grayscale(1);opacity:.5}
.arow.got .ai{filter:none;opacity:1}
.arow small{display:block;color:#9a866a;font-size:.85em}
.stars{font-size:3em;text-align:center;letter-spacing:.1em;color:#3a2c1c;margin:.1em 0 .2em}
.stars i{font-style:normal;display:inline-block}
.stars i.on{color:#ffd040;text-shadow:0 0 .4em rgba(255,200,60,.7);animation:starpop .5s both}
@keyframes starpop{0%{transform:scale(0) rotate(-40deg);opacity:0}70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1);opacity:1}}
.rate{text-align:center;color:#e0a060;font-weight:bold;letter-spacing:2px;margin-bottom:.5em}
.jarrow{display:flex;justify-content:space-between;color:#ffd870;font-size:1.15em;padding:.4em .5em;margin:.5em 0;background:#120b07;border:1px solid var(--wood)}
#talk{position:absolute;left:.7em;top:36em;display:none;font-size:1.15em;padding:.6em .9em;z-index:12}
#btns{left:auto;right:.7em;bottom:2.1em;flex-direction:column;flex-wrap:nowrap;align-items:stretch;justify-content:flex-end;width:12.5em;padding:0;gap:.5em}
#btns .bt{font-size:1em;padding:.55em .4em;width:100%}
#btns #hold{font-size:1.55em;padding:.85em .4em}
#btns #bdoc{font-size:1.6em;padding:.95em .4em;background:linear-gradient(#8c5726,#6a3c14);border-color:var(--amber2);letter-spacing:2px;animation:glow 1.6s ease-in-out infinite}
#btns #bdoc.on,#btns #bdoc:active{animation:none}
#ui>#hint{display:none!important}
#tut{top:13.6em!important;font-size:.9em!important}
.hchips{flex-wrap:wrap;font-size:.85em}
/* ===== СТАРИННЫЙ HUD ===== */
:root{--gold:#d8b068;--gold2:#f0d898;--brass:#8a6a34;--serif:'Palatino Linotype','Book Antiqua',Palatino,'Times New Roman',serif}
#top .bd,.hchips .bd,.hroom{position:relative;font-family:var(--serif);background:linear-gradient(#2c1d10,#140c07);border:1px solid var(--brass);outline:1px solid rgba(216,176,104,.3);outline-offset:-3px;box-shadow:0 2px 0 #0a0705,inset 0 1px 0 rgba(240,216,152,.2),inset 0 0 9px rgba(0,0,0,.6)}
.hchips .warn{outline-color:rgba(255,130,110,.3)}
#top .bd::before,#top .bd::after,.hchips .bd::before,.hchips .bd::after{content:'';position:absolute;top:50%;width:5px;height:5px;background:var(--gold);border:1px solid #3a2410;transform:translateY(-50%) rotate(45deg);box-shadow:0 0 5px rgba(216,176,104,.55)}
#top .bd::before,.hchips .bd::before{left:-4px}
#top .bd::after,.hchips .bd::after{right:-4px}
.dayb b{color:var(--gold2);text-shadow:0 1px 0 #000;letter-spacing:1px}
.dayb span{font-variant:small-caps;letter-spacing:1.5px}
.money b{color:#ffe08a;text-shadow:0 0 8px rgba(255,210,100,.45)}
.hroom{display:flex;align-items:center;gap:.6em;color:var(--gold2);letter-spacing:3px;font-variant:small-caps;text-shadow:0 1px 0 #000,0 0 10px rgba(216,176,104,.35);padding:.2em .8em}
.hroom::before,.hroom::after{content:'';width:1.5em;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.hroom::after{transform:scaleX(-1)}
.hnav{font-family:var(--serif);background:linear-gradient(#6a4a22,#33200d 55%,#4a3015);color:var(--gold2);border:1px solid var(--gold);text-shadow:0 1px 0 #000;letter-spacing:.5px;box-shadow:0 2px 0 #0a0705,inset 0 1px 0 rgba(255,236,180,.35),inset 0 -1px 0 rgba(0,0,0,.5)}
.mbar{background:#0a0604;border:1px solid var(--brass);box-shadow:inset 0 1px 3px #000}
.mbar u{background:linear-gradient(#fff2c8,#c9a05a 60%,#8a6a34);box-shadow:0 0 5px rgba(240,216,152,.5)}
.warn .mbar u{background:linear-gradient(#ffb0a0,#d05a48 60%,#8a2a20);box-shadow:0 0 5px rgba(230,100,80,.5)}
#evt,#tut{font-family:var(--serif);background:linear-gradient(90deg,rgba(20,12,6,.96),rgba(52,34,16,.97) 50%,rgba(20,12,6,.96));border:1px solid var(--gold);outline:1px solid rgba(216,176,104,.35);outline-offset:-4px;text-shadow:0 1px 0 #000;overflow:hidden;animation:fadein .25s ease-out both}
#evt{color:var(--gold2);font-style:italic;letter-spacing:1px;padding:.55em .9em}
#tut{color:#f0e4c4}
#tut b{color:var(--gold2)}
@keyframes unfurl{0%{opacity:0;clip-path:inset(0 50% 0 50%)}100%{opacity:1;clip-path:inset(0 0 0 0)}}
@keyframes sheen{to{left:130%}}
@keyframes glow{0%,100%{box-shadow:0 2px 0 #0a0705,0 0 0 rgba(240,200,110,0)}50%{box-shadow:0 2px 0 #0a0705,0 0 16px rgba(240,200,110,.6),inset 0 0 8px rgba(255,230,160,.25)}}
@keyframes popm{0%{transform:scale(1)}35%{transform:scale(1.2);filter:brightness(1.6) drop-shadow(0 0 6px rgba(240,200,110,.8))}100%{transform:scale(1)}}

/* ===== лоток ингредиентов ===== */
#tray{display:none;grid-auto-flow:column;grid-auto-columns:1fr;gap:.35em;pointer-events:auto}
.ing{position:relative;background:linear-gradient(#4c3019,#33200f);border:2px solid #7a5530;border-bottom-width:4px;border-radius:2px;padding:.2em 0 .15em;font-size:1.55em;line-height:1.15;color:#fff;touch-action:none;cursor:pointer;box-shadow:0 2px 0 #0a0705;font-family:inherit}
.ing:active,.ing.on{background:linear-gradient(#e09048,#c87838);transform:translateY(2px);box-shadow:none}
.ing small{position:absolute;right:2px;bottom:0;font:bold 8px 'Courier New',monospace;color:#ffd870;line-height:1}
.ing.want{border-color:#ffd870}
.ing.done{border-color:#6ca05e;background:linear-gradient(#36623a,#264426)}

function rr(x, y, w, h, r){

  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

window.addEventListener('touchstart', function(e){
  swipeBlock = false;
  if(!e.touches || !e.touches.length) return;
  touchX = e.touches[0].clientX;
  touchY = e.touches[0].clientY;

window.addEventListener('touchend', function(e){
  var blocked = swipeBlock; swipeBlock = false;
  if(blocked || !e.changedTouches || !e.changedTouches.length) return;

  var dy = Math.abs(e.changedTouches[0].clientY - touchY);

function update(dt){
  if(game.phase === 'home'){ updateHome(dt); return; }
  if(game.phase === 'drive'){ updateDrive(dt); return; }
  game.time += dt;
  if(game.vip && game.phase === 'play'){ game.milk = 1; game.cleanGlasses = game.glassTotal; game.dirtyGlasses = 0; }
  if(evtT > 0){ evtT -= dt; if(evtT <= 0) $('evt').style.display = 'none'; }
  if(game.blackout > 0) game.blackout -= dt;
  if(game.jarT > 0) game.jarT -= dt;
  if(game.basket.t > 0) game.basket.t -= dt;
  if(game.police){
    game.police.t -= dt; game.police.tick -= dt;
    if(game.police.tick <= 0){ game.police.tick = .32; tone(Math.floor(game.time*3) % 2 ? 760 : 960, .16, 'square', .035); }
    if(game.police.t <= 0) game.police = null;
  }

  var rainSp = game.heavyRain ? 1.7 : 1;
  for(var i=0; i<game.rain.length; i++){
    var d = game.rain[i];
    d.y += (7 + d.s*11) * rainSp * dt;
    if(d.y > 112){ d.y = 0; d.x = Math.random()*110; }
  }
  for(var i=0; i<game.particles.length; i++){
    var p = game.particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 90 * dt; p.t -= dt;
  }
  game.particles = game.particles.filter(function(p){ return p.t > 0; });
  for(var i=0; i<game.floats.length; i++){
    var f = game.floats[i];
    f.y -= 13 * dt; f.t -= dt;
  }
  game.floats = game.floats.filter(function(f){ return f.t > 0; });

  if(fadeT > 0) fadeT -= dt;
  var skT = game.vip ? Math.min(1, game.vipServed / VIP_TOTAL) : Math.min(1, Math.max(0, (game.spawned - 1 + (game.active ? 0.5 : 0)) / NSHIFT));
  if(skyP === null) skyP = skT; else skyP += (skT - skyP) * Math.min(1, dt * 0.4);
  // плавная гирлянда: включается по вечернему небу, с декором горит всегда
  var garT = game.upg.decor > 0 ? 1 : Math.max(0, Math.min(1, ((skyP || 0) - .3) / .25));
  game.garl += (garT - game.garl) * Math.min(1, dt * 1.5);

  if(game.wash.active){
    game.wash.t += dt;
    if(game.view === 1 && Math.random() < .25) addBurst(150 + Math.random()*60, 400, '#cfeaff', 1);
    if(game.view === 1 && Math.random() < .1) tone(700 + Math.random()*300, .04, 'sine', .02);
    if(game.wash.t >= game.wash.dur) finishWash();
  }
  var g = game.glass;
  var patDrain = (1 / (55 + game.upg.jukebox * 14)) * (game.rush ? 1.15 : 1) * (game.blackout > 0 ? .6 : 1) * (game.tutDone ? 1 : 0);
  var cx0 = 1 + .3 * ((g.mods || []).length) + (g.needsSnack ? .15 : 0) + (g.needsDoc ? .3 : 0) + (g.orderType === 'foam' ? .15 : 0); if(modBusy(g)) cx0 = 99;

  for(var i=0; i<game.cats.length; i++){
    var c = game.cats[i];
    if(c.vip && c.state === 'waiting' && game.vipServed >= VIP_TOTAL) leave(c, false);
    if(c.purr > 0) c.purr -= dt;
    if(c.react > 0) c.react -= dt;
    if(c.state === 'entering'){
      var dir = Math.sign(c.tx - c.x); c.x += dir * 150 * dt;
      if((c.tx - c.x)*dir <= 0){ c.x = c.tx; c.state = 'waiting'; }
    }else if(c.state === 'leaving'){
      c.x += c.out * 115 * dt;
    }else if((c.state === 'waiting' || c.state === 'active') && !c.talk && !g.serving && passEl.style.display !== 'block'){
      c.pat -= (c.vip ? VIP_PAT : patDrain / (c.state === 'active' ? cx0 : 1)) * dt;
      if(c.pat <= 0) leave(c, true);
    }else if((c.state === 'drinking' || c.state === 'sitting') && !c.talk){
      if(c.state === 'drinking'){
        var vk = c.vip ? VIP_DRINK : 1;
        c.cyc += dt * vk; var sip = c.cyc > .35 && c.cyc < 1.15;
        if(sip){
          c.cup = Math.max(0, c.cup - c.cup0 / 2.2 * dt * vk);
          c.cupFoam = Math.max(0, (c.cupFoam || 0) - .12 * dt);
          if(!c.sip) c.sip = true;
        }else if(c.sip){
          c.sip = false; c.stache = 1.8; sGulp();
        }
        var tl = c.cyc < 1.5 ? 1 : 0;
        c.lift += (tl - c.lift) * Math.min(1, dt*6);
        c.tilt += ((sip ? 1 : 0) - c.tilt) * Math.min(1, dt*8);
        if(c.cyc >= 1.9){
          c.cyc = 0;
          if(c.cup <= .005){
            c.cup = 0; c.cupFoam = 0;
            if(c.vip && game.vipServed < VIP_TOTAL){ c.state = 'waiting'; c.pat = 1; c.sip = false; c.lift = 0; c.tilt = 0; c.bub = ''; c.bt = 0; }
            else{ c.state = 'sitting'; c.sit = c.vip ? 1.0 : 6 + Math.random()*6; if(!c.vip) game.dirtyGlasses++; }
          }
        }
      }else{
        c.sip = false;
        c.lift += (0 - c.lift) * Math.min(1, dt*6);
        c.tilt += (0 - c.tilt) * Math.min(1, dt*8);
        if(game.tutDone || !(game.tutStep < 12 || game.tutStep >= 19)) c.sit -= dt;
        if(c.sit <= 0) leave(c, false);
      }
    }
    if(c.bt > 0){ c.bt -= dt; if(c.bt <= 0) c.bub = ''; }
    if(c.stache > 0) c.stache -= dt;
  }
  game.cats = game.cats.filter(function(c){ return !(c.state === 'leaving' && (c.x < -90 || c.x > W + 90)); });

  if(game.phase === 'play'){
    game.nextT -= dt;
    if(!game.active && !g.serving && game.nextT <= 0){
      var ws = game.cats.filter(function(c){ return c.state === 'waiting'; }), w = ws[0];
      if(game.vip){ for(var wi=1; wi<ws.length; wi++){ if(ws[wi].pat < w.pat) w = ws[wi]; } }
      if(w) activate(w);
    }
    game.spawnT -= dt;
    if(game.vip){ if(!game.vipSpawned && game.spawnT <= 0) vipSpawn(); }
    else if(game.spawned < NSHIFT && game.spawnT <= 0 && (game.tutDone || game.spawned < game.tutAllow)){
      game.spawnT = spawn() ? (game.rush ? 8.0 + Math.random()*3.0 : 13.0 + Math.random()*4.0) : 4.0;
    }
    if((game.vip ? game.vipSpawned : game.spawned >= NSHIFT) && game.cats.length === 0 && !game.active && !game.dlg && !game.wash.active && !game.drag.active) endShift();
  }

  if(game.phase === 'play' && game.tutDone && !game.vip && game.needs){ game.needs.fatigue = cl01(game.needs.fatigue + dt * (game.shift >= 3 ? .8 : .3)); }
  var ex = (game.needs && game.needs.fatigue >= 95) ? 1 + .4 * Math.sin(game.time * 11) : 1;
  var baseSpeed = .62 * (1 - game.upg.nozzle * .08);
  var pourSpeed = baseSpeed * (0.85 + g.level * 0.55) * ex;
  if(game.pouringCan > 0){
    game.pouringCan -= dt;
    game.milk = Math.min(1, game.milk + 0.55 * dt);
    if(game.pouringCan <= 0){
      game.pouringCan = 0;
      pourOff();
      tone(880, .1, 'triangle');
      save();
    }
  }

  if(g.pouring){
    var dm = Math.min(game.milk, pourSpeed * dt);
    g.level = Math.min(1, g.level + dm);
    game.milk = Math.max(0, game.milk - dm * 0.24 / (1 + game.upg.barrel * .3));
    if(pn && ac){ pn.frequency.setValueAtTime(135 + g.level * 190, ac.currentTime); }
    if(Math.random() < .35) addBurst(NX, g.y + 25*g.sc - 50*g.sc*g.level, '#ffffff', 1);
    if(g.level >= 1 || game.milk <= 0.002) stopPour();
  }
  if(g.inertia > 0){
    g.inertia -= dt;
    g.level = Math.min(1, g.level + pourSpeed * .62 * dt);
    if(g.inertia <= 0){ g.inertia = 0; g.used = true; g.settle = g.orderType === 'foam' ? 1.6 : .42; }
  }
  if(g.whipping){ g.foam = Math.min(.25, g.foam + .22 * dt); if(g.foam >= .25) stopWhip(); }
  modUpdate(dt);
  if(g.used && !g.serving && !g.whipping){
    if(g.settle > 0) g.settle -= dt;
    if(g.settle <= 0 && !modBusy(g) && (!modPending(g) || (g.modWait -= dt) <= 0)) serve();
  }
  if(g.serving){
    g.sp += dt * 3.0; var c = game.active;
    if(g.sp >= 1) afterServe();
    else if(c){
      var e = g.sp * g.sp * (3 - 2 * g.sp);
      g.x = GX + (c.x - GX) * e; g.y = GY + (348 - GY) * e; g.sc = 1 - .35 * e;
    }
  }
  if(game.dlg && game.dlg.stage === 1){ game.dlg.t += dt; if(game.dlg.t > 3.5) closeDlg(); }
  tutUpdate(dt);
  refresh();
}

var last = 0;
function fxFatigue(){
  if(game.phase !== 'play' || !game.needs || !game.tutDone) return;
  var f = game.needs.fatigue, nt = game.shift >= 3, T = game.time;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if(nt){ ctx.fillStyle = 'rgba(10,14,48,.22)'; ctx.fillRect(0, 0, W, H); }
  if(f > 60){ var a = Math.min(.55, (f - 60) / 40 * .55) * (.75 + .25 * Math.sin(T * 2)), gr = ctx.createRadialGradient(W / 2, H / 2, H * .25, W / 2, H / 2, H * .75); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(5,5,20,' + a + ')'); ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H); }
  if(f >= 99){ var lid = (Math.sin(T * 1.3) + 1) / 2, hh = H * .12 * lid; ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect(0, 0, W, hh); ctx.fillRect(0, H - hh, W, hh); smt('Z z z... засыпаю на смене', W / 2, 138, 10, '#cfd8ff'); }
  ctx.fillStyle = 'rgba(18,12,8,.82)'; ctx.fillRect(6, 92, 96, 12); ctx.fillStyle = f < 60 ? '#6ca05e' : (f < 85 ? '#e0a040' : '#d85a48'); ctx.fillRect(7, 93, 94 * f / 100, 10);
  smt((nt ? 'НОЧЬ ' : '') + 'УСТАЛ. ' + Math.round(f) + '%', 54, 98, 7, '#fff');
}
function loop(now){
  var dt = Math.min(.05, (now - last) / 1000) || .016;
  last = now; update(dt); render(); fxFatigue();
  requestAnimationFrame(loop);
}

showTitle(); topBar(); requestAnimationFrame(loop);
})();
</script></body></html>
